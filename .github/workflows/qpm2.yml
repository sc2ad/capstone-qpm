name: QPM2 build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Fernthedev/qpm-action@v2
      - name: Build QPKG
        run: qpm2 qpkg
      - name: Verify packaged static archive
        run: |
          python3 -c "from pathlib import Path; from zipfile import ZipFile; assert ZipFile('capstone.qpkg').read('bin/libcapstone.a') == Path('libcapstone.a').read_bytes()"
      - uses: actions/upload-artifact@v4
        with:
          name: capstone
          path: |
            libcapstone.a
            capstone.qpkg
          if-no-files-found: error
